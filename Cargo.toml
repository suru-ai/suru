[package]
name = "suru"
version = "0.2.0"
edition = "2024"

[workspace]
members = ["crates/suru-relay", "crates/suru-relay-protocol"]
# The Relay and the protocol it shares with the Server are linted and tested beside Suru itself.
default-members = [".", "crates/suru-relay", "crates/suru-relay-protocol"]

[dependencies]
suru-build-id = { path = "crates/suru-build-id" }
suru-relay-protocol = { path = "crates/suru-relay-protocol" }
async-trait = "0.1"
anyhow = "1.0.99"
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
axum = "0.8.4"
base64 = "0.22.1"
blake3 = "1.8.2"
clap = { version = "4.5.46", features = ["derive"] }
crossterm = "0.28.1"
dirs = "6.0.0"
diesel = { version = "2", features = ["sqlite"] }
diesel_migrations = "2"
# Canonicalizes without the Windows verbatim prefix Git refuses; see `src/paths.rs`.
dunce = "1.0.5"
eventsource-stream = "0.2.3"
fs2 = "0.4.3"
futures-util = "0.3.31"
hostname = "0.4.1"
# The Pairing's pinned-key client: HTTP over a connection it is handed, rather than one it dials itself —
# HTTP/1.1 over a direct way, and HTTP/2 over a Relay way, carrying everything asked by it on one join — and the
# Serving side's server for each.
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "client-proxy", "http1", "http2", "service", "tokio"] }
if-addrs = "0.15.0"
# Encodes a clipboard image's pixels to PNG before upload, and decodes the four admitted formats
# for thumbnails; no other decoder is compiled in (ADR 0038).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }
pulldown-cmark = "0.13.4"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rmcp = { version = "3.4.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
# `system-proxy` reads the operating system's HTTP proxy, which a Server honours on its way to a Relay;
# loopback and direct Pairing dials opt out of every proxy.
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream", "system-proxy"] }
ratatui = { version = "0.29.0", features = ["unstable-rendered-line-info"] }
# The last release on ratatui 0.29. Its defaults would link chafa and enable every image format;
# Suru tells it the protocol and cell size rather than letting it probe (ADR 0038).
ratatui-image = { version = "9.0.0", default-features = false }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
# A Server verifies an HTTPS Relay against the operating system's trust store, so a company's TLS-inspecting
# proxy trusted there is trusted for it too.
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
shlex = "2"
socket2 = "0.6.5"
subtle = "2.6.1"
tempfile = "3.21.0"
termina = "0.4.0"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.47.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
# The WebSocket a Server speaks to a Relay over, opened through reqwest so it takes the system proxy and trust.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tower-service = "0.3.3"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "=0.2.0"
unicode-segmentation = "1.13.3"
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
icu_properties = "2.3.0"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
# Wipes the copy of a Server identity key a call to the platform credential store is made with.
zeroize = "1.9.0"
x509-parser = "0.18.1"
jsonc-parser = { version = "0.33.1", features = ["cst", "serde"] }
github-copilot-sdk = { version = "1.0.15-preview.3", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "macho", "pe", "std", "unaligned"] }

[dev-dependencies]
# A real Relay in-process, which the Relay tests drive a Server against.
suru-relay = { path = "crates/suru-relay" }
# The Copilot fixtures answer the SDK's own protocol handshake, so they read the version it speaks
# from the crate rather than pinning a literal that silently rots on an upgrade.
github-copilot-sdk = { version = "1.0.15-preview.3", default-features = false }
portable-pty = "0.9.0"
sysinfo = "0.37.2"
# The Claude fixtures verify the spawn-time session identifier is a well-formed UUID.
uuid = "1.18.1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# A Secret Service of the tests' own, which the Linux identity store is tested against over a peer-to-peer connection.
zbus = { version = "5.19.0", default-features = false, features = ["tokio", "p2p"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Hears a Server process's shutdown signals on a thread of its own, apart from the runtime's; see
# `server::ProcessCutoff`. Already built for crossterm.
signal-hook = "0.3.18"

[target.'cfg(target_os = "linux")'.dependencies]
# Keeps the Server identity key in the Secret Service (ADR-0050), over zbus, a D-Bus client written in Rust, so the
# release binaries link no libdbus, with the session's encryption done in Rust rather than OpenSSL. zbus runs on the
# tokio Suru already builds, and Suru connects it to the bus itself, so a connection given up on never blocks.
secret-service = { version = "5.2.0", features = ["rt-tokio-crypto-rust"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

# The login keychain a Server keeps its identity key in on macOS (ADR-0050), through Keychain Services' item
# API. Both are already built for rustls-platform-verifier.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
security-framework = { version = "3.7.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }

# The binaries that ship, built only by CI for a release tag (`cargo build --profile dist`). Cargo's defaults
# shipped a 46 MB binary: over a quarter of it symbol names nothing reads, and nearly a tenth generic code that each
# codegen unit instantiated for itself. Stripping drops the first; fat LTO over a single codegen unit merges the
# second, at the price of a build several times slower, so `--release` keeps Cargo's defaults for everyday use.
[profile.dist]
inherits = "release"
strip = true
lto = "fat"
codegen-units = 1

# An executable without an embedded build identity, which is every test binary, is identified by hashing all of it.
# Unoptimized, that costs seconds per Server start wherever BLAKE3 has no assembly to fall back on (aarch64).
[profile.dev.package.blake3]
opt-level = 3
