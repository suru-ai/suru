[package]
name = "suru"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
axum = "0.8.4"
base64 = "0.22.1"
blake3 = "1.8.2"
clap = { version = "4.5.46", features = ["derive"] }
crossterm = "0.28.1"
dirs = "6.0.0"
diesel = { version = "2", features = ["sqlite"] }
diesel_migrations = "2"
eventsource-stream = "0.2.3"
fs2 = "0.4.3"
futures-util = "0.3.31"
hostname = "0.4.1"
if-addrs = "0.15.0"
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }
pulldown-cmark = "0.13.4"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
ratatui = { version = "0.29.0", features = ["unstable-rendered-line-info"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
shlex = "2"
socket2 = "0.6.5"
subtle = "2.6.1"
tempfile = "3.21.0"
termina = "0.4.0"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1.47.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "=0.2.0"
unicode-segmentation = "1.13.3"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
x509-parser = "0.18.1"
jsonc-parser = { version = "0.33.1", features = ["cst", "serde"] }
github-copilot-sdk = { version = "1.0.12-preview.0", default-features = false }

[dev-dependencies]
# The Copilot fixtures answer the SDK's own protocol handshake, so they read the version it speaks
# from the crate rather than pinning a literal that silently rots on an upgrade.
github-copilot-sdk = { version = "1.0.12-preview.0", default-features = false }
portable-pty = "0.9.0"
sysinfo = "0.37.2"
# The Claude fixtures verify the spawn-time session identifier is a well-formed UUID.
uuid = "1.18.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }
