[package]
name = "suru"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
axum = "0.8.4"
blake3 = "1.8.2"
clap = { version = "4.5.46", features = ["derive"] }
crossterm = { version = "0.28.1", features = ["event-stream"] }
dirs = "6.0.0"
diesel = { version = "2", features = ["sqlite"] }
diesel_migrations = "2"
eventsource-stream = "0.2.3"
fs2 = "0.4.3"
futures-util = "0.3.31"
pulldown-cmark = "0.13.4"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
ratatui = { version = "0.29.0", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
shlex = "2"
tempfile = "3.21.0"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1.47.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "=0.2.0"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
jsonc-parser = { version = "0.33.1", features = ["cst", "serde"] }
github-copilot-sdk = { version = "1.0.12-preview.0", default-features = false }

[dev-dependencies]
# The Copilot fixtures answer the SDK's own protocol handshake, so they read the version it speaks
# from the crate rather than pinning a literal that silently rots on an upgrade.
github-copilot-sdk = { version = "1.0.12-preview.0", default-features = false }
sysinfo = "0.37.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading"] }
