name: Build

# Checks and builds Suru for every platform it ships for. A PR or a plain manual run checks formatting, lints,
# tests, and keeps the archives as short-lived workflow artifacts. Given a tag, it attaches the archives to that
# tag's draft release instead, one per target as each finishes; a target already attached is not rebuilt, so
# re-running failed jobs (or dispatching again with the same tag) finishes a partial release.
#
# Only a release signs and notarizes its macOS binary, so only a release reads the Apple secrets below;
# scripts/macos-signing-wizard.sh walks a maintainer through creating them.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release to attach the archives to, e.g. v1.2.3. Leave empty for a plain build.
        type: string
        default: ""
  workflow_call:
    inputs:
      tag:
        description: Draft release to attach the archives to.
        type: string
        required: true
    secrets:
      APPLE_DEVELOPER_ID_P12_BASE64:
        description: The Developer ID Application certificate and its private key, as a base64-encoded p12.
        required: true
      APPLE_DEVELOPER_ID_P12_PASSWORD:
        description: The password the p12 was exported with.
        required: true
      APPLE_TEAM_ID:
        description: The Apple Developer Team ID the certificate belongs to.
        required: true
      APPLE_API_KEY:
        description: An App Store Connect API key (the contents of its AuthKey_*.p8), for notarization.
        required: true
      APPLE_API_KEY_ID:
        description: The App Store Connect API key's Key ID.
        required: true
      APPLE_API_ISSUER_ID:
        description: The App Store Connect API key's Issuer ID.
        required: true

concurrency:
  # A new push supersedes a PR's build; anything else, a release above all, runs to the end.
  group: ${{ github.event_name == 'pull_request' && format('build-pr-{0}', github.event.pull_request.number) || format('build-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Panics keep their file and line, but the test build's debug info no longer fills the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RELEASE_TAG: ${{ inputs.tag }}
  # The dist profile's fat LTO is for the binaries that ship. Every other run only leaves a binary to try, so it
  # builds the release profile rather than spend LTO's extra minutes on each runner.
  BUILD_PROFILE: ${{ inputs.tag && 'dist' || 'release' }}

jobs:
  fmt:
    name: Format
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --check

  scripts:
    name: Install scripts
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck scripts/install.sh
      - name: Analyze install.ps1
        shell: pwsh
        # The script talks to the person running it, which is what Write-Host is for.
        run: Invoke-ScriptAnalyzer -Path scripts/install.ps1 -ExcludeRule PSAvoidUsingWriteHost -EnableExit

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, archive: tar.gz, exe: "" }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, archive: tar.gz, exe: "" }
          - { target: aarch64-apple-darwin, runner: macos-15, archive: tar.gz, exe: "" }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025, archive: zip, exe: .exe }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm, archive: zip, exe: .exe }
    env:
      TARGET: ${{ matrix.target }}
      ARCHIVE: ${{ matrix.archive }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Name the archive
        id: archive
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_TAG" ]; then
            if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::'$RELEASE_TAG' is not a release tag like v1.2.3."
              exit 1
            fi
            label=$RELEASE_TAG
          else
            label=${COMMIT_SHA::7}
          fi
          echo "stem=suru-$label-$TARGET" >> "$GITHUB_OUTPUT"
          echo "file=suru-$label-$TARGET.$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Check the release for this archive
        id: existing
        if: env.RELEASE_TAG != ''
        env:
          FILE: ${{ steps.archive.outputs.file }}
        run: |
          set -euo pipefail
          listing=$(gh api "repos/$GH_REPO/releases?per_page=100" --paginate --jq "
            .[] | select(.tag_name == \"$RELEASE_TAG\")
            | \"release\t\(.draft)\", (.assets[] | select(.name == \"$FILE\") | \"asset\t\(.id)\t\(.state)\")")
          draft=$(awk -F'\t' '$1 == "release" { print $2 }' <<< "$listing")
          asset_id=$(awk -F'\t' '$1 == "asset" { print $2 }' <<< "$listing")
          asset_state=$(awk -F'\t' '$1 == "asset" { print $3 }' <<< "$listing")
          if [ -z "$draft" ]; then
            echo "::error::No release exists for $RELEASE_TAG."
            exit 1
          fi
          if [ "$asset_state" = uploaded ]; then
            echo "::notice::$FILE is already attached to $RELEASE_TAG; not rebuilding it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$draft" != true ]; then
            echo "::error::$RELEASE_TAG is published, and a published release is immutable: $FILE can no longer be attached."
            exit 1
          fi
          if [ -n "$asset_id" ]; then
            # An interrupted upload leaves an unfinished asset holding the name; clear it for the new one.
            echo "Deleting unfinished $FILE ($asset_state)"
            gh api -X DELETE "repos/$GH_REPO/releases/assets/$asset_id"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.existing.outputs.skip != 'true'
        with:
          # A release builds its tag, not the commit the run was dispatched from.
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Free disk space
        # Linux runners leave about 14 GB free; the SDKs Suru never uses hold far more than that.
        if: steps.existing.outputs.skip != 'true' && contains(matrix.target, 'linux')
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install the toolchain
        id: toolchain
        if: steps.existing.outputs.skip != 'true'
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - name: Install Linux build dependencies
        # The Copilot SDK links OpenSSL through native-tls on Linux, with no feature to opt out of it.
        if: steps.existing.outputs.skip != 'true' && contains(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config lld
          # x86_64 already links with Rust's bundled lld; elsewhere the system linker is much slower
          # at the large debug test binaries.
          if [ "$TARGET" = aarch64-unknown-linux-gnu ]; then
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-Clink-arg=-fuse-ld=lld" >> "$GITHUB_ENV"
          fi

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.existing.outputs.skip != 'true'
        with:
          key: ${{ matrix.target }}
          # A run whose tests fail still leaves its compiled dependencies for the next.
          cache-on-failure: true

      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        if: env.RELEASE_TAG == ''
        with:
          tool: cargo-nextest

      # A release builds a commit its PR has already checked, so only non-release runs lint and test.
      - name: Clippy
        if: env.RELEASE_TAG == ''
        run: cargo clippy --locked --all-targets --target "$TARGET" -- -D warnings

      - name: Test
        if: env.RELEASE_TAG == ''
        # Every failure in one run, rather than only the first.
        run: cargo nextest run --locked --no-fail-fast --target "$TARGET"

      # Built, packaged and uploaded even when a lint or test above fails, so every run leaves a binary
      # to try; the job still fails.
      - name: Build
        id: build
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo build --profile "$BUILD_PROFILE" --locked --target "$TARGET"

      # A release's macOS binary is signed with the maintainer's Developer ID and notarized, so the login keychain
      # trusts every Suru release by its publisher rather than by one binary's hash, and an upgrade never asks
      # "suru wants to use your confidential information" (ADR-0050). No other build signs, or needs the secrets.
      - name: Sign the macOS binary
        id: sign
        if: env.RELEASE_TAG != '' && runner.os == 'macOS' && steps.build.outcome == 'success'
        env:
          # The keychain's trust is bound to this identifier and the certificate's Team ID together. Never change
          # either: a release under any other pair brings the prompt back for every user, on every item.
          CODESIGN_IDENTIFIER: ai.suru.cli
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for secret in APPLE_DEVELOPER_ID_P12_BASE64 APPLE_DEVELOPER_ID_P12_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!secret}" ]; then
              echo "::error::The $secret secret is not set; run scripts/macos-signing-wizard.sh to create it."
              exit 1
            fi
          done

          # A keychain of the job's own, so the certificate never meets the runner's login keychain. A later step
          # removes it whether or not this one succeeds.
          umask 077
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          # Without options: it never locks itself partway through the job.
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          base64 --decode <<< "$APPLE_DEVELOPER_ID_P12_BASE64" > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          # Lets codesign use the key without a prompt that nobody on the runner could answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" \
            > /dev/null
          # codesign looks for the identity, and the chain above it, through the user's search list.
          search_list=("$keychain")
          while IFS= read -r listed; do
            search_list+=("$listed")
          done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"(.*)"$/\1/')
          security list-keychains -d user -s "${search_list[@]}"

          identity=$(security find-identity -v -p codesigning "$keychain" |
            awk -v team="($APPLE_TEAM_ID)\"" '/"Developer ID Application: / && index($0, team) { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "::error::The p12 holds no valid Developer ID Application identity for team $APPLE_TEAM_ID."
            security find-identity -p codesigning "$keychain"
            exit 1
          fi

          binary="target/$TARGET/$BUILD_PROFILE/suru"
          # Hardened runtime and a secure timestamp, both of which notarization requires.
          codesign --force --sign "$identity" --keychain "$keychain" --identifier "$CODESIGN_IDENTIFIER" \
            --options runtime --timestamp "$binary"
          # Signed under the identifier, by a Developer ID Application certificate Apple issued to the team: what
          # the designated requirement printed below says, and so what the keychain will trust.
          requirement="identifier \"$CODESIGN_IDENTIFIER\" and anchor apple generic"
          requirement+=" and certificate 1[field.1.2.840.113635.100.6.2.6]"
          requirement+=" and certificate leaf[field.1.2.840.113635.100.6.1.13]"
          requirement+=" and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\""
          codesign --verify --strict --verbose=2 --test-requirement "=$requirement" "$binary"
          codesign --display --verbose=2 "$binary"
          codesign --display --requirements - "$binary"

      - name: Notarize the macOS binary
        if: steps.sign.outcome == 'success'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for secret in APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [ -z "${!secret}" ]; then
              echo "::error::The $secret secret is not set; run scripts/macos-signing-wizard.sh to create it."
              exit 1
            fi
          done

          umask 077
          key="$RUNNER_TEMP/notary-api-key.p8"
          printf '%s\n' "$APPLE_API_KEY" > "$key"
          credentials=(--key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          # notarytool takes a zip, not a bare binary. Nor can a bare binary have the ticket stapled to it:
          # Gatekeeper finds the ticket online instead, which is enough.
          ditto -c -k "target/$TARGET/$BUILD_PROFILE/suru" "$RUNNER_TEMP/notarize.zip"
          # Judged by the status it reports, and not stopped by its exit code, so a rejection still prints its log.
          result=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${credentials[@]}" --wait \
            --output-format json) || true
          echo "$result"
          id=$(jq -r '.id // empty' <<< "$result" 2> /dev/null || true)
          status=$(jq -r '.status // empty' <<< "$result" 2> /dev/null || true)
          if [ "$status" != Accepted ]; then
            echo "::error::Notarization ended ${status:-without a verdict}, so the macOS binary is not released."
            if [ -n "$id" ]; then
              xcrun notarytool log "$id" "${credentials[@]}" || true
            fi
            exit 1
          fi

      - name: Remove the signing keychain and keys
        if: always() && runner.os == 'macOS' && steps.sign.outcome != 'skipped'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-api-key.p8"

      - name: Package
        id: package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          STEM: ${{ steps.archive.outputs.stem }}
          FILE: ${{ steps.archive.outputs.file }}
          EXE: ${{ matrix.exe }}
        run: |
          set -euo pipefail
          mkdir -p "dist/$STEM"
          cp "target/$TARGET/$BUILD_PROFILE/suru$EXE" README.md "dist/$STEM/"
          cd dist
          if [ "$ARCHIVE" = zip ]; then
            pwsh -NoProfile -Command "Compress-Archive -Path '$STEM' -DestinationPath '$FILE'"
          else
            tar -czf "$FILE" "$STEM"
          fi

      # Unlike packaging, attaching waits on every step above, so a macOS binary that failed its signing or
      # notarization is never released.
      - name: Attach to the release
        if: env.RELEASE_TAG != '' && steps.existing.outputs.skip != 'true'
        env:
          FILE: ${{ steps.archive.outputs.file }}
        run: gh release upload "$RELEASE_TAG" "dist/$FILE"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && env.RELEASE_TAG == '' && steps.package.outcome == 'success' }}
        with:
          path: dist/${{ steps.archive.outputs.file }}
          # The archive is uploaded as-is rather than zipped again, keeping the Unix binary's executable bit.
          archive: false
          retention-days: 7
          if-no-files-found: error
