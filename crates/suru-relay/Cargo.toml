[package]
name = "suru-relay"
# The Relay's own version, apart from Suru's: it is released only when it changes (ADR-0047).
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
suru-relay-protocol = { path = "../suru-relay-protocol" }
anyhow = "1.0.99"
async-trait = "0.1"
axum = { version = "0.8.4", features = ["ws"] }
base64 = "0.22.1"
clap = { version = "4.5.46", features = ["derive"] }
diesel = { version = "2", features = ["returning_clauses_for_sqlite_3_35", "sqlite"] }
diesel_migrations = "2"
futures-util = "0.3.31"
ipnet = "2.12.1"
# Builds SQLite into the binary, so running a Relay needs no other service or system library.
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }
# Reaches GitHub through the system's HTTP proxy, verifying it against the operating system's trust store,
# as a Server reaches its Relays.
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls", "system-proxy"] }
# Checks the proof a Server makes with its key, and signs the GitHub App's own tokens with its private key.
ring = "0.17.14"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
tempfile = "3.21.0"
tokio = { version = "1.47.1", features = ["io-util", "process", "test-util"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
