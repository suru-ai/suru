[package]
name = "suru-relay-protocol"
# Carried by the Relay protocol itself, never by Suru's version (ADR-0047).
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22.1"
blake3 = "1.8.2"
ring = "0.17.14"
serde = { version = "1.0.219", features = ["derive"] }
x509-parser = "0.18.1"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
serde_json = "1.0.143"
